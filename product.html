<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de producto | Apps de Excel para tu negocio</title><meta name="description" content="Aplicaciones de Excel y .xlsm listas para usar."><link rel="icon" type="image/png" href="assets/gic-logo.png">
  <script>if(localStorage.getItem('gic-theme')==='dark'||(!localStorage.getItem('gic-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#1e3a5f'},fontFamily:{sans:['Public Sans','sans-serif']}}}}</script>
  <style>.material-symbols-outlined{vertical-align:middle;line-height:1}.line-clamp-1,.line-clamp-2{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical}.line-clamp-1{-webkit-line-clamp:1}.line-clamp-2{-webkit-line-clamp:2}</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100">
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center"><div class="flex items-center gap-3"><img src="assets/gic-logo.png" alt="GIC" class="h-8 w-8 object-contain"><a href="./" class="font-bold text-lg">Apps <span class="text-primary">para Negocio</span></a></div></div></header>
  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="product-page" aria-live="polite"><div id="product-page-content" class="py-16 text-center text-slate-500">Cargando producto…</div><p id="product-page-error" role="alert" class="hidden mt-5 rounded-xl bg-rose-50 dark:bg-rose-950/30 p-4 text-rose-700 dark:text-rose-300"></p></div>
  </main>
  <footer class="bg-slate-900 text-slate-400"><div class="max-w-7xl mx-auto px-4 py-8 text-sm">Productos digitales para negocios.</div></footer>
  <script src="config.js"></script><script src="app.js"></script>
  <script>
  (() => {
    const page = document.getElementById('product-page-content');
    const apiBase = String(window.GOODS_API_BASE || '').replace(/\/$/, '');
    const store = window.GoodsStore;
    const escapeHtml = store.escapeHtml;
    const slug = new URLSearchParams(window.location.search).get('slug');
    const renderNotFound = () => { page.innerHTML = '<section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-8 text-center"><span class="material-symbols-outlined text-5xl text-slate-300">search_off</span><h1 class="mt-4 text-2xl font-bold">Producto no encontrado</h1><p class="mt-2 text-slate-600 dark:text-slate-400">El producto que buscas no está disponible.</p><a href="./" class="mt-6 inline-flex rounded-xl bg-primary px-5 py-3 font-semibold text-white hover:bg-blue-800">Ver catálogo</a></section>'; };
    const resolveAssetUrl = (url) => store.isPublicUrl(url) ? url : `${apiBase}${url}`;
    const load = async () => {
      if (!slug) return renderNotFound();
      try {
        const response = await fetch(`${apiBase}/api/goods/catalog/${encodeURIComponent(slug)}`);
        const product = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(product.error || 'Producto no encontrado');
        const title = escapeHtml(product.title || 'Producto sin título');
        const category = escapeHtml(product.category || 'Aplicación de negocio');
        const tiers = [
          ['personal', 'Personal', 'Un usuario, un negocio', product.price_cents],
          ['empresa', 'Empresa', 'Uso interno multi-usuario, una sola organización', product.price_cents_empresa],
          ['reventa', 'Reventa', 'Puedes entregar el archivo a tus propios clientes', product.price_cents_reventa]
        ].filter(([, , , priceCents]) => priceCents != null).map(([tier, name, description, priceCents]) => `<section data-tier="${tier}" class="rounded-2xl border border-slate-200 dark:border-slate-700 p-4"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-bold text-lg">${name}</h2><p class="mt-1 text-sm text-slate-600 dark:text-slate-300">${description}</p></div><p class="font-bold text-primary">${escapeHtml(store.formatPrice(priceCents, product.currency))}</p></div><button type="button" data-buy-product="${escapeHtml(product.id)}" data-tier="${tier}" class="mt-4 inline-flex items-center justify-center gap-1.5 rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 disabled:opacity-60 transition-colors"><span class="material-symbols-outlined text-[16px]">shopping_cart</span>Comprar</button></section>`).join('');
        const thumbnail = product.thumbnail_url ? resolveAssetUrl(product.thumbnail_url) : '';
        const video = product.video_url ? resolveAssetUrl(product.video_url) : '';
        const visual = thumbnail ? `<img src="${escapeHtml(thumbnail)}" alt="${title}" class="h-full w-full object-cover">` : '<div class="h-full w-full flex items-center justify-center bg-primary/10 text-primary"><span class="material-symbols-outlined text-7xl">table_chart</span></div>';
        const manualUrl = product.manual_url ? resolveAssetUrl(product.manual_url) : ''; const manual = product.has_manual && manualUrl ? `<a href="${escapeHtml(manualUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 rounded-full bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 px-2.5 py-1 text-[11px] font-semibold hover:text-primary"><span class="material-symbols-outlined text-[14px]">description</span>Ver manual</a>` : '';
        const videoSection = video ? `<div class="aspect-video overflow-hidden rounded-3xl bg-black shadow-xl"><video controls preload="metadata" poster="${escapeHtml(thumbnail)}" class="h-full w-full object-contain" src="${escapeHtml(video)}">Tu navegador no admite video. <a href="${escapeHtml(video)}" target="_blank" rel="noopener">Ver demo</a></video></div>` : `<div class="aspect-video overflow-hidden rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">${visual}</div>`;
        const subtitle = escapeHtml(product.subtitle || product.sub_title || product.tagline || 'Aplicación de Excel lista para trabajar');
        page.innerHTML = `<article><a href="./" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Volver al catálogo</a><section class="mt-5">${videoSection}</section><div class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1.15fr)_minmax(18rem,0.85fr)]"><div><div class="flex flex-wrap gap-2"><span class="inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-semibold bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300">${category}</span>${manual}</div><h1 class="mt-4 text-3xl font-extrabold sm:text-4xl">${title}</h1><p class="mt-2 text-lg font-medium text-slate-500 dark:text-slate-400">${subtitle}</p><div class="mt-6 aspect-[4/3] overflow-hidden rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">${visual}</div><p class="mt-6 whitespace-pre-line leading-relaxed text-slate-600 dark:text-slate-300">${escapeHtml(product.description || 'Aplicación lista para usar.')}</p></div><aside><section><h2 class="text-xl font-bold">Elige tu licencia</h2><div class="mt-4 space-y-3">${tiers}</div><a href="licencia.html#personal" class="mt-4 inline-block text-sm font-semibold text-primary hover:underline">Ver términos de licencia completos</a></section></aside></div></article>`;
        document.title = `${product.title || 'Producto'} | Apps de Excel para tu negocio`;
      } catch (_) { renderNotFound(); }
    };
    load();
  })();
  </script>
</body>
</html>
