<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración de productos | GIC</title><link rel="icon" type="image/png" href="../assets/gic-logo.png"><script>if(localStorage.getItem('gic-theme')==='dark'||(!localStorage.getItem('gic-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}</script><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#1e3a5f'},fontFamily:{sans:['Public Sans','sans-serif']}}}}</script></head><body class="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100"><header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"><div class="flex items-center gap-3"><img src="../assets/gic-logo.png" alt="GIC" class="h-8 w-8 object-contain"><a href="../" class="font-bold text-lg">Apps <span class="text-primary">para Negocio</span></a><nav class="ml-4 flex gap-3 text-sm font-semibold"><a href="index.html" class="text-slate-600 dark:text-slate-300 hover:text-primary">Solicitudes</a><a href="products.html" class="text-primary">Productos</a></nav></div><button id="change-key" class="text-sm font-semibold text-primary">Cambiar clave</button></div></header><main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10"><section id="key-gate" class="max-w-md mx-auto rounded-2xl border bg-white dark:bg-slate-900 p-6"><h1 class="text-2xl font-bold">Acceso administrativo</h1><form id="key-form" class="mt-5 space-y-3"><input id="admin-key" type="password" required class="w-full rounded-xl border p-3" placeholder="Clave administrativa"><button class="rounded-xl bg-primary px-5 py-3 font-semibold text-white">Guardar</button></form><p id="key-error" class="hidden mt-4 text-sm text-rose-700"></p></section><section id="products-view" class="hidden"><div class="flex justify-between"><div><h1 class="text-3xl font-extrabold">Productos</h1><p class="mt-1 text-slate-600 dark:text-slate-400">Todos los productos, publicados o no.</p></div><button id="refresh" class="rounded-xl bg-primary px-5 py-3 font-semibold text-white">Actualizar</button></div><p id="error" class="hidden mt-5 rounded-xl bg-rose-50 p-4 text-rose-700"></p><div class="mt-6 overflow-x-auto rounded-2xl border bg-white dark:bg-slate-900"><table class="w-full min-w-[1100px] text-sm"><thead class="bg-slate-100 dark:bg-slate-800 text-left"><tr><th class="p-4">Vista</th><th class="p-4">Título / slug</th><th class="p-4">Categoría</th><th class="p-4">Precio</th><th class="p-4">Estado</th><th class="p-4">Assets</th><th class="p-4">Creado</th><th class="p-4">Acciones</th></tr></thead><tbody id="products-body"></tbody></table></div></section></main><dialog id="edit-dialog" class="rounded-2xl border bg-white dark:bg-slate-900 p-6 w-full max-w-xl"><form id="edit-form" class="space-y-3"><h2 class="text-xl font-bold">Editar producto</h2><input id="edit-id" type="hidden"><input id="edit-title" required class="w-full rounded-xl border p-3" placeholder="Título"><textarea id="edit-description" class="w-full rounded-xl border p-3" placeholder="Descripción"></textarea><input id="edit-category" class="w-full rounded-xl border p-3" placeholder="Categoría"><div class="grid grid-cols-2 gap-3"><input id="edit-price" type="number" min="0" required class="rounded-xl border p-3" placeholder="Precio personal (centavos)"><input id="edit-currency" required class="rounded-xl border p-3" placeholder="Moneda"></div><div class="grid grid-cols-2 gap-3"><input id="edit-price-empresa" type="number" min="0" class="rounded-xl border p-3" placeholder="Precio Empresa (opcional)"><input id="edit-price-reventa" type="number" min="0" class="rounded-xl border p-3" placeholder="Precio Reventa (opcional)"></div><div class="flex justify-end gap-3"><button type="button" id="close-edit" class="rounded-xl border px-4 py-2">Cancelar</button><button class="rounded-xl bg-primary px-4 py-2 font-semibold text-white">Guardar</button></div></form></dialog><script src="../config.js"></script><script>(()=>{const API=String(window.GOODS_API_BASE||'').replace(/\/$/,''),q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'),key=()=>localStorage.getItem('gic-admin-key')||'',gate=q('#key-gate'),view=q('#products-view'),error=q('#error'),body=q('#products-body'),dialog=q('#edit-dialog');let products=[];const request=async(route,payload={},method='POST')=>{const r=await fetch(API+route,{method,headers:{'X-GIC-Admin-Key':key(),'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'No se pudo completar la solicitud.');e.status=r.status;throw e}return j},copy=async v=>{try{await navigator.clipboard.writeText(v)}catch(_){prompt('Copia este valor:',v)}},price=p=>new Intl.NumberFormat('es-MX',{style:'currency',currency:String(p.currency||'MXN').toUpperCase()}).format(Number(p.price_cents||0)/100),render=()=>body.innerHTML=products.length?products.map(p=>`<tr class="border-t align-top"><td class="p-4">${p.has_thumbnail?`<img src="${esc(API+'/api/goods/assets/'+encodeURIComponent(p.id)+'/thumbnail')}" class="h-10 w-10 rounded-lg object-cover">`:'—'}</td><td class="p-4"><strong>${esc(p.title)}</strong><div class="mt-1 font-mono text-xs text-slate-500">${esc(p.slug)} <button data-copy="https://excel.gic.mx/p/${esc(p.slug)}/" class="text-primary">Copiar enlace</button></div></td><td class="p-4">${esc(p.category)}</td><td class="p-4">${esc(price(p))}</td><td class="p-4"><span class="rounded-full px-2.5 py-1 text-xs font-semibold ${p.published?'bg-emerald-100 text-emerald-800':'bg-slate-200 text-slate-700'}">${p.published?'Activo':'Inactivo'}</span></td><td class="p-4">${p.has_video?'▶ video ':''}${p.has_manual?'▤ manual ':''}${p.has_thumbnail?'▣ miniatura':''}</td><td class="p-4 whitespace-nowrap">${esc(p.created_at)}</td><td class="p-4 space-x-2"><button data-edit="${esc(p.id)}" class="text-primary">Editar</button><button data-toggle="${esc(p.id)}" class="text-slate-700 dark:text-slate-300">${p.published?'Desactivar':'Activar'}</button><button data-delete="${esc(p.id)}" class="text-rose-700">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="8" class="p-8 text-center text-slate-500">No hay productos.</td></tr>';const load=async()=>{error.classList.add('hidden');try{products=(await request('/admin/goods/products/list')).products||[];render()}catch(e){if(e.status===401||e.status===403){localStorage.removeItem('gic-admin-key');gate.classList.remove('hidden');view.classList.add('hidden');q('#key-error').textContent='Clave inválida.';q('#key-error').classList.remove('hidden');return}error.textContent=e.message;error.classList.remove('hidden')}};q('#key-form').onsubmit=e=>{e.preventDefault();localStorage.setItem('gic-admin-key',q('#admin-key').value);gate.classList.add('hidden');view.classList.remove('hidden');load()};q('#change-key').onclick=()=>{localStorage.removeItem('gic-admin-key');gate.classList.remove('hidden');view.classList.add('hidden')};q('#refresh').onclick=load;body.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy)return copy(b.dataset.copy);const p=products.find(x=>x.id===(b.dataset.edit||b.dataset.toggle||b.dataset.delete));try{if(b.dataset.edit){q('#edit-id').value=p.id;q('#edit-title').value=p.title||'';q('#edit-description').value=p.description||'';q('#edit-category').value=p.category||'';q('#edit-price').value=p.price_cents;q('#edit-price-empresa').value=p.price_cents_empresa??'';q('#edit-price-reventa').value=p.price_cents_reventa??'';q('#edit-currency').value=p.currency;dialog.showModal();return}if(b.dataset.toggle)await request(`/admin/goods/products/${encodeURIComponent(p.id)}`,{published:!p.published},'PATCH');if(b.dataset.delete){if(!confirm(`¿Eliminar ${p.title}?`))return;await request(`/admin/goods/products/${encodeURIComponent(p.id)}`,{},'DELETE')}await load()}catch(x){error.textContent=x.message;error.classList.remove('hidden')}};q('#close-edit').onclick=()=>dialog.close();q('#edit-form').onsubmit=async e=>{e.preventDefault();try{await request(`/admin/goods/products/${encodeURIComponent(q('#edit-id').value)}`,{title:q('#edit-title').value,description:q('#edit-description').value,category:q('#edit-category').value,price_cents:Number(q('#edit-price').value),price_cents_empresa:q('#edit-price-empresa').value===''?null:Number(q('#edit-price-empresa').value),price_cents_reventa:q('#edit-price-reventa').value===''?null:Number(q('#edit-price-reventa').value),currency:q('#edit-currency').value},'PATCH');dialog.close();load()}catch(x){error.textContent=x.message;error.classList.remove('hidden')}};if(key()){gate.classList.add('hidden');view.classList.remove('hidden');load()}})();</script></body></html>
