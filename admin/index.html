<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración de solicitudes | GIC</title><link rel="icon" type="image/png" href="../assets/gic-logo.png">
  <script>if(localStorage.getItem('gic-theme')==='dark'||(!localStorage.getItem('gic-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#ec5b13'},fontFamily:{sans:['Public Sans','sans-serif']}}}}</script>
  <style>.material-symbols-outlined{vertical-align:middle;line-height:1}</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100">
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"><div class="flex items-center gap-3"><img src="../assets/gic-logo.png" alt="GIC" class="h-8 w-8"><a href="../" class="font-bold text-lg">Apps <span class="text-primary">para Negocio</span></a></div><button id="change-key" type="button" class="text-sm font-semibold text-primary">Cambiar clave</button></div></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <section id="key-gate" class="max-w-md mx-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6"><h1 class="text-2xl font-bold">Acceso administrativo</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Ingresa la clave para consultar la cola.</p><form id="key-form" class="mt-5 space-y-3"><input id="admin-key" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-3" placeholder="Clave administrativa"><button class="rounded-xl bg-primary px-5 py-3 font-semibold text-white hover:bg-orange-600">Guardar</button></form><p id="key-error" role="alert" class="hidden mt-4 text-sm font-medium text-rose-700 dark:text-rose-300"></p></section>
    <section id="queue-view" class="hidden"><div class="flex flex-wrap items-center justify-between gap-4"><div><h1 class="text-3xl font-extrabold">Cola de solicitudes</h1><p class="mt-1 text-slate-600 dark:text-slate-400">Reclama solicitudes y continúa el trabajo desde la terminal.</p></div><button id="refresh" type="button" class="rounded-xl bg-primary px-5 py-3 font-semibold text-white hover:bg-orange-600"><span class="material-symbols-outlined text-[18px]">refresh</span> Actualizar</button></div><p id="queue-error" role="alert" class="hidden mt-5 rounded-xl bg-rose-50 dark:bg-rose-950/30 p-4 text-rose-700 dark:text-rose-300"></p><div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"><table class="w-full min-w-[900px] text-sm"><thead class="bg-slate-100 dark:bg-slate-800 text-left"><tr><th class="p-4">ID</th><th class="p-4">Estado</th><th class="p-4">Solicitud</th><th class="p-4">Contacto</th><th class="p-4">Contexto</th><th class="p-4">Fecha</th><th class="p-4">Acción</th></tr></thead><tbody id="requests-body"></tbody></table></div></section>
  </main>
  <script src="../config.js"></script>
  <script>
  (() => {
    const API = String(window.GOODS_API_BASE || '').replace(/\/$/, '');
    const keyGate = document.getElementById('key-gate'), queueView = document.getElementById('queue-view'), keyError = document.getElementById('key-error'), queueError = document.getElementById('queue-error'), body = document.getElementById('requests-body');
    const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const short = (v, n = 60) => { const s = String(v || '').replace(/\s+/g, ' ').trim(); return esc(s.length > n ? s.slice(0, n - 1) + '…' : s); };
    const key = () => localStorage.getItem('gic-admin-key') || '';
    const request = async (route, payload = {}) => { const response = await fetch(API + route, { method: 'POST', headers: {'X-GIC-Admin-Key': key(), 'Content-Type': 'application/json'}, body: JSON.stringify(payload) }); const json = await response.json().catch(() => ({})); if (!response.ok) { const error = new Error(json.error || 'No se pudo completar la solicitud.'); error.status = response.status; throw error; } return json; };
    const badge = (status) => { const c = {queued:'bg-amber-100 text-amber-800', blueprinting:'bg-blue-100 text-blue-800', generating:'bg-violet-100 text-violet-800', done:'bg-emerald-100 text-emerald-800', failed:'bg-rose-100 text-rose-800'}[status] || 'bg-slate-100 text-slate-700'; return `<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${c}">${esc(status)}</span>`; };
    const copy = async (value) => { try { await navigator.clipboard.writeText(value); } catch (_) { window.prompt('Copia este valor:', value); } };
    const showGate = (message = '') => { queueView.classList.add('hidden'); keyGate.classList.remove('hidden'); keyError.textContent = message; keyError.classList.toggle('hidden', !message); };
    const load = async () => { queueError.classList.add('hidden'); try { const payload = await request('/admin/goods/requests/list', {}); const order = {queued:0, blueprinting:1, generating:2, done:3, failed:4}; const rows = (payload.requests || []).sort((a,b) => (order[a.status] ?? 99) - (order[b.status] ?? 99) || String(b.created_at || '').localeCompare(String(a.created_at || ''))); body.innerHTML = rows.length ? rows.map((r) => `<tr class="border-t border-slate-100 dark:border-slate-800 align-top"><td class="p-4 font-mono text-xs break-all">${esc(r.id)} <button data-copy="${esc(r.id)}" class="text-primary" title="Copiar ID"><span class="material-symbols-outlined text-[16px]">content_copy</span></button></td><td class="p-4">${badge(r.status)}</td><td class="p-4 max-w-xs">${short(r.text)}</td><td class="p-4">${short(r.contact, 32)}</td><td class="p-4">${short(r.hint, 32)}</td><td class="p-4 whitespace-nowrap">${esc(r.created_at || '')}</td><td class="p-4">${r.status === 'queued' ? `<button data-claim="${esc(r.id)}" class="rounded-lg bg-primary px-3 py-2 text-xs font-semibold text-white hover:bg-orange-600">Comenzar</button><div data-result="${esc(r.id)}"></div>` : ''}</td></tr>`).join('') : '<tr><td class="p-8 text-center text-slate-500" colspan="7">No hay solicitudes.</td></tr>'; } catch (err) { if (err.status === 401 || err.status === 403) { localStorage.removeItem('gic-admin-key'); showGate('Clave inválida. Inténtalo de nuevo.'); return; } queueError.textContent = err.message; queueError.classList.remove('hidden'); } };
    document.getElementById('key-form').addEventListener('submit', (event) => { event.preventDefault(); localStorage.setItem('gic-admin-key', document.getElementById('admin-key').value); keyGate.classList.add('hidden'); queueView.classList.remove('hidden'); load(); });
    document.getElementById('change-key').addEventListener('click', () => { localStorage.removeItem('gic-admin-key'); showGate(); }); document.getElementById('refresh').addEventListener('click', load);
    body.addEventListener('click', async (event) => { const copyButton = event.target.closest('[data-copy]'); if (copyButton) return copy(copyButton.dataset.copy); const claimButton = event.target.closest('[data-claim]'); if (!claimButton) return; claimButton.disabled = true; const id = claimButton.dataset.claim, result = body.querySelector(`[data-result="${CSS.escape(id)}"]`); try { await request('/admin/goods/requests/claim', {request_id:id}); result.innerHTML = `<div class="mt-3 rounded-lg bg-slate-100 dark:bg-slate-800 p-3 text-xs"><p class="mb-2">Ejecuta este comando en tu terminal para continuar.</p><code class="break-all">node scripts/goods-cli/goods.js start ${esc(id)}</code> <button data-copy-command="node scripts/goods-cli/goods.js start ${esc(id)}" class="text-primary"><span class="material-symbols-outlined text-[15px]">content_copy</span></button></div>`; claimButton.remove(); } catch (err) { result.textContent = err.message; result.className = 'mt-2 text-xs text-rose-700 dark:text-rose-300'; claimButton.disabled = false; } });
    body.addEventListener('click', (event) => { const button = event.target.closest('[data-copy-command]'); if (button) copy(button.dataset.copyCommand); });
    if (key()) { keyGate.classList.add('hidden'); queueView.classList.remove('hidden'); load(); } else showGate();
  })();
  </script>
</body></html>
