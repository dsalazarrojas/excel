<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración de solicitudes | GIC</title><link rel="icon" type="image/png" href="../assets/gic-logo.png">
  <script>if(localStorage.getItem('gic-theme')==='dark'||(!localStorage.getItem('gic-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}</script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#1e3a5f'},fontFamily:{sans:['Public Sans','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100">
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"><div class="flex items-center gap-3"><img src="../assets/gic-logo.png" alt="GIC" class="h-8 w-8 object-contain"><a href="../" class="font-bold text-lg">Apps <span class="text-primary">para Negocio</span></a><nav class="ml-4 flex gap-3 text-sm font-semibold"><a href="index.html" class="text-primary">Solicitudes</a><a href="products.html" class="text-slate-600 dark:text-slate-300 hover:text-primary">Productos</a></nav></div><button id="change-key" type="button" class="text-sm font-semibold text-primary">Cambiar clave</button></div></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <section id="key-gate" class="max-w-md mx-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6"><h1 class="text-2xl font-bold">Acceso administrativo</h1><form id="key-form" class="mt-5 space-y-3"><input id="admin-key" type="password" required class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-3" placeholder="Clave administrativa"><button class="rounded-xl bg-primary px-5 py-3 font-semibold text-white">Guardar</button></form><p id="key-error" class="hidden mt-4 text-sm text-rose-700"></p></section>
    <section id="queue-view" class="hidden"><div class="flex flex-wrap items-center justify-between gap-4"><div><h1 class="text-3xl font-extrabold">Cola de solicitudes</h1><p class="mt-1 text-slate-600 dark:text-slate-400">Reclama, cancela o elimina solicitudes.</p></div><button id="refresh" class="rounded-xl bg-primary px-5 py-3 font-semibold text-white">Actualizar</button></div><div class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><select id="status-filter" class="rounded-xl border p-3"><option value="">Todos los estados</option><option>queued</option><option>blueprinting</option><option>generating</option><option>done</option><option>failed</option><option>cancelled</option></select><input id="search-filter" class="rounded-xl border p-3" placeholder="Buscar solicitud, contacto o autor"><input id="from-filter" type="date" class="rounded-xl border p-3"><input id="to-filter" type="date" class="rounded-xl border p-3"></div><p id="queue-error" class="hidden mt-5 rounded-xl bg-rose-50 p-4 text-rose-700"></p>
      <div class="mt-6 overflow-x-auto rounded-2xl border bg-white dark:bg-slate-900"><table class="w-full min-w-[1200px] text-sm"><thead class="bg-slate-100 dark:bg-slate-800 text-left"><tr><th data-sort="id" class="p-4 cursor-pointer">ID</th><th data-sort="status" class="p-4 cursor-pointer">Estado</th><th data-sort="text" class="p-4 cursor-pointer">Solicitud</th><th class="p-4">Autor</th><th class="p-4">Enlaces</th><th class="p-4">Contexto</th><th data-sort="created_at" class="p-4 cursor-pointer">Fecha ▼</th><th class="p-4">Acción</th></tr></thead><tbody id="requests-body"></tbody></table></div>
    </section>
  </main>
  <script src="../config.js"></script>
  <script>
  (()=>{
    const API=String(window.GOODS_API_BASE||'').replace(/\/$/,''),q=s=>document.querySelector(s),body=q('#requests-body'),gate=q('#key-gate'),view=q('#queue-view'),err=q('#queue-error'),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'),short=(v,n=60)=>{const s=String(v||'').replace(/\s+/g,' ').trim();return esc(s.length>n?s.slice(0,n-1)+'…':s)},key=()=>localStorage.getItem('gic-admin-key')||'';
    let rows=[],sort='created_at',dir=-1;
    const request=async(route,payload={},method='POST')=>{const r=await fetch(API+route,{method,headers:{'X-GIC-Admin-Key':key(),'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'No se pudo completar la solicitud.');e.status=r.status;throw e}return j};
    const copy=async v=>{try{await navigator.clipboard.writeText(v)}catch(_){window.prompt('Copia este valor:',v)}};
    const link=(value,label)=>{const url=String(value||'').trim();return /^https?:\/\//i.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener" class="text-primary font-semibold hover:underline">${esc(label)} ↗</a>`:''};
    const saved=(row,...names)=>names.map(name=>row[name]).find(value=>String(value||'').trim())||'';
    const badge=s=>`<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${({queued:'bg-amber-100 text-amber-800',blueprinting:'bg-blue-100 text-blue-800',generating:'bg-violet-100 text-violet-800',done:'bg-emerald-100 text-emerald-800',failed:'bg-rose-100 text-rose-800',cancelled:'bg-slate-200 text-slate-700'})[s]||'bg-slate-100'}">${esc(s)}</span>`;
    const render=()=>{const term=q('#search-filter').value.toLowerCase(),status=q('#status-filter').value,from=q('#from-filter').value,to=q('#to-filter').value;const visible=rows.filter(r=>(!status||r.status===status)&&(!term||[r.text,r.hint,r.contact,r.author].join(' ').toLowerCase().includes(term))&&(!from||String(r.created_at).slice(0,10)>=from)&&(!to||String(r.created_at).slice(0,10)<=to)).sort((a,b)=>String(a[sort]??'').localeCompare(String(b[sort]??''),undefined,{numeric:true})*dir);body.innerHTML=visible.length?visible.map(r=>{const author=saved(r,'author_url','author_link','author','contact_url','contact_link'),requestUrl=saved(r,'post_link','request_url','request_link','source_url','source_link'),productUrl=saved(r,'product_url','product_link')||(r.product_slug?`https://excel.gic.mx/p/${encodeURIComponent(r.product_slug)}/`:'');return `<tr class="border-t align-top"><td class="p-4 font-mono text-xs">${esc(r.id)} <button data-copy="${esc(r.id)}" class="text-primary">⧉</button></td><td class="p-4">${badge(r.status)}</td><td class="p-4 max-w-xs">${short(r.text)}</td><td class="p-4">${link(author,'Abrir autor')||short(author||r.contact,32)}</td><td class="p-4 space-y-1">${link(requestUrl,'Solicitud')||'—'}<br>${link(productUrl,'Producto')||'—'}${productUrl?` <button data-copy="${esc(productUrl)}" class="text-primary text-xs">Copiar</button>`:''}</td><td class="p-4">${short(r.hint,32)}</td><td class="p-4 whitespace-nowrap">${esc(r.created_at)}</td><td class="p-4 space-x-2">${r.status==='queued'?`<button data-claim="${esc(r.id)}" class="text-primary font-semibold">Comenzar</button>`:''}<button data-cancel="${esc(r.id)}" class="text-slate-700 dark:text-slate-300">Cancelar</button><button data-delete="${esc(r.id)}" class="text-rose-700">Eliminar</button></td></tr>`}).join(''):'<tr><td colspan="8" class="p-8 text-center text-slate-500">No hay solicitudes.</td></tr>'};
    const load=async()=>{err.classList.add('hidden');try{rows=(await request('/admin/goods/requests/list')).requests||[];render()}catch(e){if(e.status===401||e.status===403){localStorage.removeItem('gic-admin-key');gate.classList.remove('hidden');view.classList.add('hidden');q('#key-error').textContent='Clave inválida.';q('#key-error').classList.remove('hidden');return}err.textContent=e.message;err.classList.remove('hidden')}};
    q('#key-form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('gic-admin-key',q('#admin-key').value);gate.classList.add('hidden');view.classList.remove('hidden');load()});q('#change-key').onclick=()=>{localStorage.removeItem('gic-admin-key');gate.classList.remove('hidden');view.classList.add('hidden')};q('#refresh').onclick=load;['#status-filter','#search-filter','#from-filter','#to-filter'].forEach(s=>q(s).addEventListener('input',render));document.querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{if(sort===h.dataset.sort)dir*=-1;else{sort=h.dataset.sort;dir=1}render()});body.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy)return copy(b.dataset.copy);try{if(b.dataset.claim)await request('/admin/goods/requests/claim',{request_id:b.dataset.claim});if(b.dataset.cancel)await request(`/admin/goods/requests/${encodeURIComponent(b.dataset.cancel)}`,{status:'cancelled'},'PATCH');if(b.dataset.delete){if(!confirm('¿Eliminar esta solicitud?'))return;await request(`/admin/goods/requests/${encodeURIComponent(b.dataset.delete)}`,{},'DELETE')}await load()}catch(x){err.textContent=x.message;err.classList.remove('hidden')}};if(key()){gate.classList.add('hidden');view.classList.remove('hidden');load()}
  })();
  </script>
</body>
</html>
